<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Visiting Foot Doctors</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <i class="ph-fill ph-feet"></i> Visiting Foot <span>Doctors</span>
      </a>
      <div class="menu-toggle">
        <i class="ph ph-list"></i>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="insurance.html">Insurance</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Thank You Section -->
  <section class="section" style="min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; background-color: var(--light-bg); margin-top: 80px;">
    <div class="container text-center reveal">
      <div style="background: var(--white); padding: 60px 40px; border-radius: 16px; box-shadow: var(--shadow-md); max-width: 600px; margin: 0 auto;">
        <i class="ph-fill ph-check-circle" style="font-size: 5rem; color: var(--primary-teal); margin-bottom: 20px;"></i>
        <h1 style="color: var(--primary-blue); font-size: 2.5rem; margin-bottom: 15px;">Thank You!</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 20px; line-height: 1.8;">
          Your message has been successfully sent. <br><br>
          <strong style="color: var(--text-dark);">Please note that it may take 24-48 hours for our team to respond.</strong>
        </p>
        <a href="index.html" class="btn btn-primary" style="margin-top: 10px;">Return Home</a>
      </div>
    </div>
  </section>

  <script type="module" src="/main.js"></script>
</body>
</html>
